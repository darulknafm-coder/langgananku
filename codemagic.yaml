# Build iOS di cloud Codemagic (Mac disediakan Codemagic) → langsung ke TestFlight.
# Syarat sebelum menjalankan (lihat panduan rilis):
#  1. Akun Apple Developer aktif.
#  2. Bundle ID "id.langgananku.app" sudah dibuat di developer.apple.com → Identifiers.
#  3. Aplikasi "LanggananKu" sudah dibuat di App Store Connect dengan bundle ID tersebut.
#  4. API key App Store Connect sudah ditambahkan di Codemagic
#     (Team settings → Integrations → Developer Portal) dengan nama "LanggananKu ASC".
workflows:
  ios-release:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: LanggananKu ASC
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: id.langgananku.app
      vars:
        APP_ID: id.langgananku.app
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Siapkan platform
        script: |
          flutter create --org id.langgananku --project-name langgananku --platforms android,ios .
          dart run tool/setup.dart
          flutter pub get
          dart run flutter_launcher_icons
      - name: Pasang profil signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
