name: Android rilis (Play Store)

# Jalan otomatis tiap push ke main, atau manual dari tab Actions.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'store/**', '*.md']
  workflow_dispatch:
    inputs:
      sms_scan:
        description: 'Aktifkan fitur pindai SMS? (false = tanpa izin READ_SMS)'
        default: 'false'
        type: choice
        options: ['false', 'true']

env:
  # ID aplikasi PERMANEN setelah upload pertama ke Play Console.
  APP_ID: id.langgananku.app
  SMS_SCAN: ${{ github.event.inputs.sms_scan || 'false' }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat folder platform
        run: flutter create --org id.langgananku --project-name langgananku --platforms android,ios .

      - name: Konfigurasi ID, izin, SDK 36, signing
        run: dart run tool/setup.dart

      - run: flutter pub get

      - name: Ikon aplikasi
        run: dart run flutter_launcher_icons

      - name: Pasang kunci rilis (upload key) dari GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secret KEYSTORE_BASE64 belum diisi — build memakai kunci debug (TIDAK bisa di-upload ke Play Store)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          sed -i 's/^ *//' android/key.properties

      - name: Uji logika deteksi
        run: flutter test
        continue-on-error: true

      - name: Build App Bundle (.aab untuk Play Store) dan APK
        run: |
          flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=SMS_SCAN=$SMS_SCAN
          flutter build apk --release --build-number=${{ github.run_number }} --dart-define=SMS_SCAN=$SMS_SCAN

      - uses: actions/upload-artifact@v4
        with:
          name: LanggananKu-android-${{ github.run_number }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
